# 1. path: ให้ใส่ . (จุด) หรือลบทิ้งไปเลย 
# เพราะไฟล์ yaml วางอยู่ข้างๆ โฟลเดอร์ train/valid อยู่แล้ว
path: .  

# 2. ระบุโฟลเดอร์รูปภาพ (Relative Path)
train: train/images
val: valid/images
test: test/images

# 3. Classes
# (YOLOv8 แนะนำให้เขียนแบบ Dictionary แต่อาร์เรย์แบบเดิมก็ได้)
nc: 2
names: 
  0: Tilapia
  1: Goldfish