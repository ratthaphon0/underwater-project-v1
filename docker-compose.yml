version: '3.8'  # ระบุ version เพื่อใช้ฟีเจอร์ GPU deploy

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # ถ้าใช้ Cloudflare Tunnel ให้แก้เป็น URL ของ Tunnel หรือปล่อยให้ Vite proxy
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio
      # - db  

  ai_service:
    build:
      context: ./ai_service_detect
    restart: unless-stopped
    volumes:
      - ./ai_service_detect:/code
      - ./ai_service_detect/models:/code/models
    ports:
      - "8001:8001"
    devices:
      # webcam passthrough — Linux host (/dev/video0 = กล้องตัวแรก)
      # ถ้ามีกล้องหลายตัว เพิ่ม /dev/video2, /dev/video4 ได้
      - /dev/video0:/dev/video0
    group_add:
      - video   # ให้ container เข้าถึง video group ของ host ได้
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # "/dev/video0" = webcam ใน Docker (Linux)
      # "fish_video.mp4" = local video file
      # "rtsp://..." = Raspberry Pi via MediaMTX
      - VIDEO_SOURCE=${VIDEO_SOURCE:-/dev/video0}
      - CONFIDENCE=${CONFIDENCE:-0.4}
      - BACKEND_URL=http://backend:8000/api/v1/ai/detect
      - SESSION_URL=http://backend:8000/api/v1/sessions
      - API_UPDATE_INTERVAL=${API_UPDATE_INTERVAL:-1.0}
    depends_on:
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Local Database Services (Run only if needed) ---
  db:
    image: postgres:16-alpine
    profiles: ["local_db"]  # รันเฉพาะตอนสั่ง --profile local_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password1234}
    volumes:
      - minio_data:/data

  adminer:
    image: adminer
    profiles: ["local_db"] # รันเฉพาะตอนสั่ง --profile local_db
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ตั้งค่าให้ Adminer มองเห็น db ง่ายขึ้น 
      - ADMINER_DEFAULT_SERVER=db

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    # network_mode: host ดีที่สุดสำหรับ Linux (Zorin OS) เพื่อให้เข้าถึง localhost ได้ทุก port
    network_mode: host 
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./config-docker.yml:/etc/cloudflared/config.yml:ro

volumes:
  db_data:
  minio_data: